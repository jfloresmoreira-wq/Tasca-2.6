<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">DAM Bootstrap</span>
        </div>
    </nav>

    <div class="container my-4">
        <div class="row">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Portal Institut</h5>
                        <p class="card-text">
                            Maquetació responsive amb CSS Grid i Flexbox per a la web del centre.
                        </p>
                        <button class="btn btn-primary btn-sm">Detalls</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Gestor d'Inventari</h5>
                        <p class="card-text">
                            Aplicació d'escriptori.
                        </p>
                        <button class="btn btn-primary btn-sm">Detalls</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Canal de Notícies</h5>
                        <p class="card-text">
                            Generació automàtica de sindicació de continguts amb RSS 2.0 i Atom.
                        </p>
                        <button class="btn btn-primary btn-sm">Detalls</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
